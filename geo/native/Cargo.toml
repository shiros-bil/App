[package]
name = "geopolit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.4"
glow = "0.14"
fontdue = "0.9"
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
khronos-egl = { version = "6", features = ["dynamic"], optional = true }
libloading = { version = "0.8", optional = true }
png = { version = "0.17", optional = true }

[features]
desktop = ["khronos-egl", "libloading", "png"]

[[bin]]
name = "shot"
path = "src/bin/shot.rs"
required-features = ["desktop"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = false
strip = true

[profile.dev]
opt-level = 2
