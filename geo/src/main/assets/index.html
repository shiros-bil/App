<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мировая Держава</title>
<style>
:root{--bg:#0a0f1a;--panel:rgba(12,18,32,.86);--panel2:rgba(20,30,52,.9);--line:rgba(140,170,220,.16);--txt:#eef3ff;--mut:#93a3c4;--acc:#4c8dff;--good:#3fd07a;--bad:#ff5a5a;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0a2a4a;color:var(--txt);font:14px Inter,system-ui,Roboto,sans-serif;overflow:hidden;letter-spacing:.1px}
canvas{position:absolute;inset:0;touch-action:none}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px}
.hud{position:absolute;left:0;right:400px;top:0;display:flex;gap:6px;padding:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.chip{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chip .ic{color:var(--gold)}.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip.me{font-weight:700}
.good{color:var(--good)}
.flag{width:28px;height:20px;border-radius:4px;object-fit:cover;background:#fff;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.flag.big{width:66px;height:46px;border-radius:6px}
.sp{flex:1}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;transition:background .15s}
button:active{transform:scale(.96)}
button.ib{padding:8px 10px}
button.p{background:var(--acc);border-color:transparent}
button.r{background:linear-gradient(180deg,#a3262b,#7d1c21);border-color:transparent}
button.g{background:linear-gradient(180deg,#1f7a46,#165c35);border-color:transparent}
button.on{background:var(--acc);border-color:transparent}
button:disabled{opacity:.38}
button small{width:100%;font-weight:500;opacity:.75;font-size:11px}
.tbox{position:fixed;top:8px;right:8px;z-index:5;display:flex;align-items:center;gap:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.clock{display:flex;align-items:center;gap:6px;white-space:nowrap;padding-right:6px;border-right:1px solid var(--line)}.clock .ic{color:var(--gold)}.clock b{font-variant-numeric:tabular-nums}
#clk{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600;min-width:42px}
.spd{display:flex;gap:2px}
.spd button{padding:6px 8px;border:0;background:transparent;border-radius:9px}.spd button.on{background:var(--acc)}
#panel{position:absolute;right:8px;bottom:8px;top:58px;width:min(340px,46vw);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#panel h2{margin:0;font-size:18px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);color:var(--mut)}
.row span:last-child{color:var(--txt);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.x{position:absolute;right:8px;top:8px;background:none;border:0;padding:6px}
#log{display:none!important;position:absolute;left:8px;bottom:8px;width:min(330px,44vw);max-height:26vh;overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:12px}
#log div{padding:4px 0;border-bottom:1px solid var(--line)}
#log .ic{width:14px;height:14px;vertical-align:-2px;color:var(--gold)}
.modal{position:absolute;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:92vw;max-height:90vh;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h1{margin:0 0 8px;font-size:22px;display:flex;gap:8px;align-items:center;justify-content:center}
.list{text-align:left;max-height:55vh;overflow:auto}
.list .it{display:flex;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.list .it:active{background:rgba(255,255,255,.05)}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
#search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt);font:inherit;margin-bottom:8px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;background:radial-gradient(circle at 50% 40%,#13254a,#060a14)}
.bar{width:220px;height:6px;background:#1a2540;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--acc);animation:l 1s infinite alternate}
@keyframes l{to{margin-left:70%}}
.tag{font-size:11px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--mut);display:inline-flex;gap:4px;align-items:center}
.tag .ic{width:12px;height:12px}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--bad)}
.off{padding:8px;border:1px solid rgba(255,90,90,.25);border-radius:10px;margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.off .prog{width:100%}
#seap{position:absolute;right:8px;bottom:8px;width:min(230px,40vw);height:52px;display:none;align-items:center;gap:14px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#seap img{height:100%;width:62px;object-fit:cover}#seap h2{margin:0 0 2px;font-size:13px;line-height:1.1}#seap .tag{font-size:10px;padding:1px 6px}#seap .x{position:absolute;right:2px;top:2px;padding:3px}#seap .x .ic{width:14px;height:14px}#seap{gap:8px}#seap .st{padding-right:22px;min-width:0}
</style></head><body>

  <div class="chip"><i data-i="users"></i><b id="popu"></b></div>

  <div class="sp"></div>
  <div class="tbox"><div class="clock"><i data-i="calendar"></i><b id="date"></b><span id="clk"></span></div><div class="spd" id="spd"></div></div>
  <button class="ib" onclick="showRank()"><i data-i="trophy"></i></button>

</div>
<div id="panel"></div>
<div id="log" style="display:none"></div>
<div id="load"><b>Загрузка карты мира…</b><div class="bar"><i></i></div></div>

  if(Math.random()<.03&&!enemies.length){const rs=terr(o),r=rs[Math.floor(Math.random()*rs.length)];const c=NB[r].map(n=>G.owner[n]).filter(t=>t!==o);
    if(!c.length)return;const t=c[Math.floor(Math.random()*c.length)];
    if(power(o)>power(t)*1.6){if(t===G.player){if(G.allies.includes(o))return;G.war.push(o);addLog(`${I("siren")} ${nm(o)} объявляет вам войну!`);setSpeed(0);dirty()}
      else{if(G.allies.includes(t)&&Math.random()<.5)return;G.aiWar.push([o,t]);if(NAT[o].pop>2e7||NAT[t].pop>2e7)addLog(`${I("swords")} ${nm(o)} объявила войну: ${nm(t)}.`)}}}}
function randomEvent(){const me=G.player,M=G.nat[me],ev=[
  ()=>{M.money+=income(me)*.02;return`${I("droplet")} Найдено месторождение нефти!`},
  ()=>{M.stab-=7;return`${I("megaphone")} Массовые протесты в столице.`},
  ()=>{for(const r of terr(me))G.gdp[r]*=.97;recalc();return`${I("trending-down")} Мировой кризис ударил по экономике.`},
  ()=>{M.tech+=.1;return`${I("lightbulb")} Учёные совершили открытие.`},
  ()=>{M.army*=.96;return`${I("tornado")} Стихийное бедствие.`}];addLog(ev[Math.floor(Math.random()*ev.length)]())}
let last=performance.now(),acc=0,lastHud=0,lastSimDraw=0;
let lastClk='';function clockStr(){const f=Math.min(.9999,Math.max(0,acc)),m=Math.floor(f*1440);const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(speed>=3?0:mm-mm%10).padStart(2,'0')}
function loop(now){const dt=Math.min(.25,(now-last)/1000);last=now;
  if(G&&!modalOpen()&&speed>0){acc+=dt*SPEEDS[speed];let n=0;
    while(acc>=1&&n<10){acc-=1;n++;dayTick()}
    if(n){if(now-lastHud>100){lastHud=now;updHud()}if(G.offs.length&&now-lastSimDraw>66){lastSimDraw=now;draw()}if(sel>=0&&panel.style.display==='block')refreshPanelLight()}}
  if(G){const c=clockStr();if(c!==lastClk){lastClk=c;const e=document.getElementById('clk');if(e)e.textContent=c}}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ================= UI =================
function modalOpen(){return !!document.getElementById('modal')}
function onTap(r,ev){if(G&&ev){const w=hitWater(ev.clientX,ev.clientY);if(w){showWater(w);return}}selW=null;if(r<0){const si=ev?hitSea(ev.clientX,ev.clientY):-1;if(si>=0&&G){showSea(si);return}closePanel();return}selSea=-1;sel=r;draw();if(!G){confirmPick(RK[r]);return}showPanel(r)}
function closePanel(){selW=null;const sp=document.getElementById('seap');if(sp)sp.style.display='none';sel=-1;selSea=-1;panel.style.display='none';draw()}
let panelSig='';
function refreshPanelLight(){const s=panelState(sel);if(s!==panelSig)showPanel(sel);else{const e=document.getElementById('offs');if(e)e.innerHTML=offsHtml(sel)}}
function panelState(i){const o=G.owner[i],M=G.nat[G.player];return [o,G.war.includes(o),G.allies.includes(o),M.money>recCost(),M.money>invCost(i),M.money>techCost(),M.money>stabCost(),M.money>spyCost(),G.offs.length].join()}
function offsHtml(i){const o=G.owner[i],P=G.player;const list=G.offs.filter(x=>(x.a===P&&G.owner[x.t]===o)||(x.a===o&&G.owner[x.t]===P)||(o===P&&(x.a===P||G.owner[x.t]===P))).slice(0,8);
  return list.map(x=>`<div class="off">${x.a===P?`${I("arrow-right")}`:`${I("arrow-left")}`} ${nm(x.a)} → ${RN[x.t]} ${x.m==='sea'?'(десант)':''}<div class="prog"><i style="width:${Math.max(0,x.p)}%"></i></div></div>`).join('')}
function showPanel(i){panel.style.bottom="";panelSig=panelState(i);const o=G.owner[i],N=G.nat[o],me=G.player,M=G.nat[me],orig=RK[i];
  let h=`<button class="x" onclick="closePanel()">${I("x")}</button><div style="display:flex;gap:10px;align-items:center">${flagImg(o,'flag big')}<div><h2>${nm(o)}</h2><span class="tag">${I("map-pin")} ${RN[i]}</span></div></div>`;
  if(o!==orig)h+=`<div style="margin-top:8px" class="chip">${flagImg(orig)} Исторически: <b>${nm(orig)}</b></div>`;
  h+=`<div style="margin-top:8px">
  <div class="row"><span>ВВП региона</span><span>$${fmt(G.gdp[i])}</span></div>
  <div class="row"><span>Население региона</span><span>${fmtN(G.pop[i])}</span></div>
  <div class="row"><span>ВВП державы</span><span>$${fmt(income(o))}</span></div>
  <div class="row"><span>Население державы</span><span>${fmtN(popOf(o))}</span></div>
  <div class="row"><span>Армия</span><span>${fmtN(N.army)}</span></div>
  <div class="row"><span>Технологии</span><span>ур. ${N.tech.toFixed(1)}</span></div>
  <div class="row"><span>Регионов</span><span>${terr(o).length}</span></div>
  ${o===me?'':`<div class="row"><span>Отношения</span><span>${rel(o)}</span></div>`}</div><div class="acts">`;
  if(o===me){
    h+=`<button class="p" onclick="act('rec')" ${M.money<recCost()?'disabled':''}>${I("users")} Мобилизация<br><small>$${fmt(recCost())}</small></button>
    <button onclick="act('inv',${i})" ${M.money<invCost(i)?'disabled':''}>${I("factory")} В регион<br><small>$${fmt(invCost(i))}</small></button>
    <button onclick="act('tech')" ${M.money<techCost()?'disabled':''}>${I("flask-conical")} Наука<br><small>$${fmt(techCost())}</small></button>`;
  }else{
    const ad=adjMode(me,i),war=G.war.includes(o),ally=G.allies.includes(o),going=G.offs.some(x=>x.a===me&&x.t===i);
    if(war)h+=`<button class="r" onclick="act('atk',${i})" ${ad&&!going?'':'disabled'}>${I("swords")} Наступать<br><small>${going?'идёт':ad?Math.round(winChance(me,i,ad.m)*100)+'% · '+(ad.m==='land'?'суша':'десант'):'нет границы'}</small></button>
      <button onclick="act('front',${o})">${I("flame")} Весь фронт</button><button onclick="act('peace',${o})">${I("bird")} Мир</button>`;
    else h+=`<button class="r" onclick="act('war',${o})" ${ally?'disabled':''}>${I("swords")} Объявить войну</button>
      <button class="g" onclick="act('ally',${o})" ${ally?'disabled':''}>${I("handshake")} Союз</button>`;
    h+=`<button onclick="act('trade',${o})" ${war?'disabled':''}>${I("package")} Торговля</button>
    <button onclick="act('sanc',${o})">${I("ban")} Санкции</button>
    <button onclick="act('spy',${o})" ${M.money<spyCost()?'disabled':''}>${I("venetian-mask")} Переворот<br><small>$${fmt(spyCost())}</small></button>`;
  }
  h+=`</div><div id="offs">${offsHtml(i)}</div><div class="acts"><button onclick="zoomToReg(${i})">${I("zoom-in")} Регион</button><button onclick="zoomToNat(${o})">${I("map")} Страна</button></div>`;
  panel.innerHTML=h;panel.style.display='block'}
function rel(o){const r=G.rel[o]??0;return G.allies.includes(o)?`${I("handshake")} Союзник`:G.war.includes(o)?`${I("swords")} Война`:r>30?`${I("handshake")} Дружба`:r<-30?`${I("ban")} Враждебность`:`${I("users")} Нейтралитет`}
const recCost=()=>income(G.player)*.03+20,invCost=i=>G.gdp[i]*.08+5,
  techCost=()=>income(G.player)*.06*G.nat[G.player].tech+30,stabCost=()=>income(G.player)*.02+10,spyCost=()=>income(G.player)*.05+40;
function act(a,x){const me=G.player,M=G.nat[me];
  switch(a){
  case'rec':{M.money-=recCost();const add=Math.max(2000,M.army*.12);M.army+=add;M.stab-=1.5;addLog(`${I("users")} Мобилизовано ${fmtN(add)} солдат.`);break}
  case'inv':{M.money-=invCost(x);G.gdp[x]*=1.08;recalc();addLog(`${I("factory")} Инвестиции: ${RN[x]}, ВВП +8%.`);break}
  case'tech':{M.money-=techCost();M.tech+=.2;addLog(`${I("flask-conical")} Технологии ур. ${M.tech.toFixed(1)}.`);break}
  case'stab':{M.money-=stabCost();M.stab=Math.min(100,M.stab+8);addLog('');break}
  case'war':{G.war.push(x);G.rel[x]=-100;M.stab-=4;addLog(`${I("swords")} Вы объявили войну: ${nm(x)}!`);dirty();break}
  case'peace':{if(G.nat[x].army<M.army*.5||Math.random()<.4){G.war=G.war.filter(w=>w!==x);G.rel[x]=-20;addLog(`${I("bird")} Мир с ${nm(x)}.`);dirty()}else addLog(`${I("x")} ${nm(x)} отвергает мир.`);break}
  case'ally':{const r=(G.rel[x]??0)+Math.random()*60-10+(power(me)>power(x)?20:0);if(r>45){G.allies.push(x);G.rel[x]=80;addLog(`${I("handshake")} ${nm(x)} — ваш союзник!`)}else{G.rel[x]=(G.rel[x]??0)+5;addLog(`${I("x")} ${nm(x)} отклоняет союз.`)}break}
  case'trade':{const g=Math.min(income(x),income(me))*.03;M.money+=g;G.nat[x].money+=g*.5;G.rel[x]=(G.rel[x]??0)+10;addLog(`${I("package")} Сделка с ${nm(x)}: +$${fmt(g)}.`);break}
  case'sanc':{G.nat[x].money*=.85;G.nat[x].stab-=5;G.rel[x]=(G.rel[x]??0)-30;G.allies=G.allies.filter(y=>y!==x);M.money-=income(me)*.01;addLog(`${I("ban")} Санкции против ${nm(x)}.`);break}
  case'spy':{M.money-=spyCost();const N=G.nat[x];if(Math.random()<(100-N.stab)/130){N.stab-=25;N.army*=.7;addLog(`${I("venetian-mask")} Переворот в ${nm(x)} удался!`)}else{G.rel[x]=-80;addLog(`${I("siren")} Агенты раскрыты: ${nm(x)}!`)}break}
  case'atk':{if(startOff(me,x))addLog(`${I("arrow-right")} Наступление: ${RN[x]}.`);break}
  case'front':{let c=0;for(const r of terr(x))for(const n of NB[r])if(G.owner[n]===me){if(startOff(me,r))c++;break}addLog(c?`${I("flame")} Наступление по всему фронту: ${c} направлений.`:'Нет общей границы.');break}
  }
  updHud();save();draw();if(sel>=0)showPanel(sel)}
function gameOver(win){localStorage.removeItem(SAVE);setSpeed(0);modal(`<h1>${win?`${I("globe")} Мировое господство!`:`${I("skull")} Поражение`}</h1><p>${win?'Весь мир под вашим флагом.':'Ваше государство пало.'}</p><button class="p" onclick="restart()">Новая игра</button>`)}
function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(m);return m}
function closeModal(){document.getElementById('modal')?.remove()}
function restart(){localStorage.removeItem(SAVE);G=null;ownVer++;closeModal();closePanel();hud.style.display='none';log.style.display='none';invalidate();pickScreen()}
function menu(){modal(`<h1>Меню</h1><p>${dateStr()}</p><div style="display:grid;gap:8px"><button class="p" onclick="closeModal()">Продолжить</button><button onclick="closeModal();zoomToNat(G.player)">К моей стране</button><button onclick="save();closeModal()">${I("save")} Сохранить</button><button class="r" onclick="restart()">Новая игра</button></div>`)}
function showRank(){const r=nations().map(o=>({o,s:income(o)+power(o)*.05,t:terr(o).length})).sort((a,b)=>b.s-a.s).slice(0,40);
  modal(`<h1>${I("trophy")} Рейтинг держав</h1><div class="list">${r.map((x,k)=>`<div class="it" onclick="closeModal();zoomToNat(${x.o})"><b>${k+1}</b><span class="sw" style="background:${natColor(x.o)}"></span>${flagImg(x.o)}<span style="flex:1">${nm(x.o)}${x.o===G.player?' (вы)':''}</span><span class="tag">${x.t} рег.</span><span class="tag">$${fmt(income(x.o))}</span></div>`).join('')}</div><br><button onclick="closeModal()">Закрыть</button>`)}
function pickScreen(){
  modal(`<h1>${I("globe")} Мировая Держава</h1><p style="color:var(--mut)">Выберите страну — коснитесь её на карте или найдите в списке</p><input id="search" placeholder="Поиск страны…"><div class="list" id="plist"></div><br><button onclick="closeModal()">Выбрать на карте</button>`);
  const order=NAT.map((f,i)=>i).filter(i=>NAT[i].pop>0&&RK.includes(i)).sort((a,b)=>NAT[b].gdp-NAT[a].gdp);
  const fill=q=>{plist.innerHTML=order.filter(i=>!q||nm(i).toLowerCase().includes(q)||NAT[i].e.toLowerCase().includes(q)).map(i=>`<div class="it" onclick="confirmPick(${i})"><span class="sw" style="background:${natColor(i)}"></span>${flagImg(i)}<span style="flex:1">${nm(i)}</span><span class="tag">$${fmt(NAT[i].gdp)}</span></div>`).join('')};
  fill('');search.oninput=e=>fill(e.target.value.toLowerCase().trim())}
function confirmPick(i){if(NAT[i].pop<=0)return;const p=NAT[i];
  modal(`${flagImg(i,'flag big')}<h1>${p.n}</h1><p>Население: ${fmtN(p.pop)}<br>ВВП: $${fmt(p.gdp)}</p><div style="display:flex;gap:8px;justify-content:center"><button onclick="pickScreen()">Назад</button><button class="p" onclick="closeModal();newGame(${i})">Играть</button></div>`);
  zoomToNat(i)}
window.onBack=()=>{if(modalOpen()){if(G)closeModal();return true}if(panel.style.display==='block'){closePanel();return true}if(G){menu();return true}return false};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save()});
init();
</script></body></html>
