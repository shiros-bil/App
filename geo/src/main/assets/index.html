<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мировая Держава</title>
<style>
:root{--bg:#0b1220;--panel:rgba(14,22,40,.94);--line:#24324f;--txt:#e8eefc;--mut:#8ea0c4;--acc:#3b82f6;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0a2a4a;color:var(--txt);font:14px system-ui,Roboto,sans-serif;overflow:hidden}
canvas{position:absolute;inset:0;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:6px;align-items:center;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.flag{width:28px;height:21px;border-radius:3px;object-fit:cover;background:#333;flex:none}
.flag.big{width:64px;height:48px}
.sp{flex:1}
button{background:#1b2a48;color:var(--txt);border:1px solid #2f4470;border-radius:10px;padding:8px 11px;font:inherit;font-weight:600}
button:active{transform:scale(.96)}
button.p{background:var(--acc);border-color:var(--acc)}
button.r{background:#7f1d1d;border-color:var(--bad)}
button.g{background:#14532d;border-color:var(--good)}
button.on{background:var(--acc);border-color:var(--acc)}
button:disabled{opacity:.4}
.spd{display:flex;gap:3px}.spd button{padding:8px 9px}
#panel{position:absolute;right:6px;bottom:6px;top:52px;width:min(340px,46vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto;display:none}
#panel h2{margin:0;font-size:17px}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a2540;color:var(--mut)}
.row span:last-child{color:var(--txt);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.x{position:absolute;right:8px;top:6px;background:none;border:0;font-size:20px;padding:4px 8px}
#log{position:absolute;left:6px;bottom:6px;width:min(330px,44vw);max-height:26vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:12px}
#log div{padding:2px 0;border-bottom:1px solid #18233c}
.modal{position:absolute;inset:0;background:rgba(3,6,14,.8);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#0f1a30;border:1px solid var(--line);border-radius:16px;padding:18px;max-width:92vw;max-height:90vh;overflow:auto;text-align:center}
.card h1{margin:0 0 6px}
.list{text-align:left;max-height:55vh;overflow:auto}
.list .it{display:flex;gap:8px;align-items:center;padding:5px;border-bottom:1px solid #1a2540}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
#search{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:inherit;margin-bottom:6px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20;background:var(--bg)}
.bar{width:220px;height:6px;background:#1a2540;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--acc);animation:l 1s infinite alternate}
@keyframes l{to{margin-left:70%}}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#1a2540;color:var(--mut)}
.prog{height:6px;background:#1a2540;border-radius:3px;overflow:hidden;margin-top:3px}.prog i{display:block;height:100%;background:var(--bad)}
.off{padding:6px;border:1px solid #3a2030;border-radius:8px;margin-top:6px;font-size:12px}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud" style="display:none">
  <div class="chip" id="me"></div>
  <div class="chip">💰 <b id="money"></b><small id="inc" style="color:var(--good)"></small></div>
  <div class="chip">🪖 <b id="army"></b></div>
  <div class="chip">🙂 <b id="stab"></b></div>
  <div class="chip">📅 <b id="date"></b></div>
  <div class="sp"></div>
  <div class="spd" id="spd"></div>
  <button onclick="showRank()">🏆</button>
  <button onclick="menu()">☰</button>
</div>
<div id="panel"></div>
<div id="log" style="display:none"></div>
<div id="load"><b>Загрузка карты мира…</b><div class="bar"><i></i></div></div>
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
"use strict";
// ================= MAP ENGINE =================
const MW=2000,MH=1000;           // map units (equirectangular, 2:1)
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const hctx=document.createElement('canvas').getContext('2d'); // hit-test ctx (identity)
let W,H,DPR=Math.min(devicePixelRatio||1,2);
let F=[],NB=[],BB=[],AREA=[],CEN=[],LP=[],LOD=[null,null,null],GRAT,proj,path;
let T=d3.zoomIdentity,zoomB;
const S0=()=>H/MH;               // base scale: map height == screen height
let K=1,X=0,Y=0;                 // screen = map*K + (X,Y)

const COL={aq:'#e6edf3',ru:'#1d3b8f',cn:'#d0201f',us:'#4a7fd4',gb:'#b8324f',fr:'#2c6bd1',de:'#5b5b5b',it:'#2f9a4c',es:'#e2b928',pt:'#1f7a3a',
jp:'#efe6d8',kr:'#6b8fd6',kp:'#8a2a2a',in:'#f08a2b',pk:'#2a6b3e',bd:'#1e8a5a',ir:'#3d9a5c',iq:'#8c6a3c',sa:'#1b6e3a',tr:'#c84343',
eg:'#c9a85c',il:'#5b93d6',sy:'#9a6464',af:'#8b7355',kz:'#45b3c9',uz:'#6fb6a8',mn:'#c15050',ua:'#f0cf34',by:'#6fae4e',pl:'#d8476a',
se:'#4a91c4',no:'#a83838',fi:'#dfe8f5',dk:'#c25a5a',nl:'#e0782f',be:'#e6c34a',ch:'#c94a4a',at:'#e86d6d',cz:'#3c71b0',sk:'#5f86c0',
hu:'#4f9a5a',ro:'#e6c83e',bg:'#3f8f58',rs:'#8f4a4a',hr:'#4f6fb2',gr:'#4fa6e0',ie:'#3ea35a',is:'#7ba7d8',ee:'#4b8fd1',lv:'#9c3a4a',lt:'#c9a43a',
ca:'#d65252',mx:'#3a8a5a',br:'#2fae4c',ar:'#86bde8',cl:'#c4485c',co:'#e6c13a',pe:'#c84a4a',ve:'#d9a42a',bo:'#4e9a3a',py:'#6a8fc6',uy:'#9ab8e0',ec:'#e3c858',cu:'#3a5fb0',
au:'#2a9d8f',nz:'#3a4f8f',id:'#c43c3c',my:'#3c4fb0',th:'#5b6fc8',vn:'#d94a3a',ph:'#4a6ed0',mm:'#4ea65a',la:'#a84a5a',kh:'#3a5aa8',
za:'#e08f36',ng:'#3f9a2e',et:'#6fa83c',cd:'#4fa8d8',dz:'#2e8a4e',ly:'#3a7a3a',ma:'#a83a3a',sd:'#c49a5a',ao:'#a8323a',ke:'#7a3a3a',tz:'#3aa0a8',
ma:'#b54141',ge:'#d65a5a',am:'#e08a3a',az:'#3fa8c8',tm:'#3d9a6a',tj:'#c25a4a',kg:'#d84a4a',om:'#a84a4a',ae:'#4a8a4a',ye:'#8a6a5a',jo:'#5a8a5a',
gl:'#d3e2ee',md:'#3a6ab0',si:'#5f9fd8',ba:'#3a5aa8',me:'#b83a3a',mk:'#e0a83a',al:'#a52a2a',cy:'#d6a855',lu:'#73b8e0',np:'#c0392b',lk:'#e0a030'};
function natColor(o){if(G&&G.col[o])return G.col[o];const iso=F[o].properties.iso;if(COL[iso])return COL[iso];
  const h=(o*137.508)%360;return `hsl(${h|0},42%,${44+(o*7)%16}%)`}

function buildLOD(topo){const fc=topojson.feature(topo,topo.objects.c).features;return fc.map(f=>new Path2D(path(f)||''))}
async function getJ(u){return (await fetch(u)).json()}
async function init(){
  proj=d3.geoEquirectangular().fitSize([MW,MH],{type:'Sphere'});path=d3.geoPath(proj);
  GRAT=new Path2D(path(d3.geoGraticule().step([20,20])()));
  const lo=await getJ('world_lo.json');
  F=topojson.feature(lo,lo.objects.c).features;NB=topojson.neighbors(lo.objects.c.geometries);
  for(const f of F){BB.push(path.bounds(f));AREA.push(path.area(f));CEN.push(d3.geoCentroid(f));LP.push(lblPt(f));const sh=SHORT[f.properties.iso];if(sh)f.properties.n=sh}
  LOD[0]=F.map(f=>new Path2D(path(f)||''));
  setupZoom();resize();document.getElementById('load').remove();
  const s=localStorage.getItem(SAVE);let ok=false;
  if(s){try{G=JSON.parse(s);ok=true;startGame()}catch(e){G=null}}
  if(!ok)pickScreen();
  // stream higher detail in background
  setTimeout(async()=>{LOD[1]=buildLOD(await getJ('world_mid.json'));draw();
    setTimeout(async()=>{LOD[2]=buildLOD(await getJ('world.json'));draw()},300)},200);
}
const LW=[],SHORT={cn:'Китай',kr:'Южная Корея',kp:'КНДР',us:'США',gb:'Великобритания',cd:'ДР Конго',cf:'ЦАР',ae:'ОАЭ',do:'Доминикана',ba:'Босния',um:'Малые о-ва США'};
function lblPt(f){const g=f.geometry;if(!g){LW.push(0);return[0,0]}let b=f;
  if(g.type==='MultiPolygon'){let ba=-1;for(const c of g.coordinates){const q={type:'Polygon',coordinates:c},a=path.area(q);if(a>ba){ba=a;b=q}}}
  const bb=path.bounds(b);LW.push(Math.min(bb[1][0]-bb[0][0],(bb[1][1]-bb[0][1])*2.2));return path.centroid(b)}
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  if(zoomB)d3.select(cv).call(zoomB.transform,T);draw()}
function constrain(t){const k=t.k,ww=MW*S0()*k,hh=H*k;let x=t.x%ww;if(x>0)x-=ww;let y=Math.min(0,Math.max(H-hh,t.y));return new d3.ZoomTransform(k,x,y)}
function setupZoom(){
  zoomB=d3.zoom().scaleExtent([1,250]).constrain(constrain).on('zoom',e=>{T=e.transform;draw()});
  d3.select(cv).call(zoomB).on('dblclick.zoom',null);
  cv.addEventListener('click',e=>onTap(hit(e.clientX,e.clientY)));
}
function zoomTo(i,dur=700){const b=BB[i],s=S0();let w=(b[1][0]-b[0][0]),h=(b[1][1]-b[0][1]);
  if(w>MW*.6){const p=LP[i];b[0]=[p[0]-150,p[1]-80];b[1]=[p[0]+150,p[1]+80];w=300;h=160}
  const k=Math.max(1,Math.min(40,.55/Math.max(w*s/W,h*s/H)));
  const cx=(b[0][0]+b[1][0])/2*s,cy=(b[0][1]+b[1][1])/2*s;
  d3.select(cv).transition().duration(dur).call(zoomB.transform,d3.zoomIdentity.translate(W/2-cx*k,H/2-cy*k).scale(k))}
function toMap(x,y){let mx=(x-X)/K,my=(y-Y)/K;mx=((mx%MW)+MW)%MW;return[mx,my]}
function curLOD(){const k=T.k;return k>10&&LOD[2]?LOD[2]:k>2.5&&LOD[1]?LOD[1]:LOD[0]}
function hit(x,y){const[mx,my]=toMap(x,y),L=LOD[1]||LOD[0];let best=-1,ba=1e18;
  for(let i=0;i<F.length;i++){const b=BB[i];if(mx<b[0][0]||mx>b[1][0]||my<b[0][1]||my>b[1][1])continue;
    if(hctx.isPointInPath(L[i],mx,my)&&AREA[i]<ba){ba=AREA[i];best=i}}
  return best}

let sel=-1,raf=0;
function draw(){if(!raf)raf=requestAnimationFrame(render)}
function render(){raf=0;if(!F.length)return;
  K=S0()*T.k;X=T.x;Y=T.y;const ww=MW*K,L=curLOD();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0d3358';ctx.fillRect(0,0,W,H);
  const vy0=(-Y)/K,vy1=(H-Y)/K;
  for(let c=0;X+c*ww<W;c++){const ox=X+c*ww;
    ctx.setTransform(DPR*K,0,0,DPR*K,DPR*ox,DPR*Y);
    const vx0=-ox/K,vx1=(W-ox)/K;
    ctx.lineWidth=.8/K;ctx.strokeStyle='rgba(140,190,240,.13)';ctx.stroke(GRAT);
    const vis=[];
    for(let i=0;i<F.length;i++){const b=BB[i];if(b[1][0]<vx0||b[0][0]>vx1||b[1][1]<vy0||b[0][1]>vy1)continue;vis.push(i);
      ctx.fillStyle=G?natColor(G.owner[i]):natColor(i);ctx.fill(L[i])}
    ctx.lineWidth=.6/K;ctx.strokeStyle='rgba(0,0,0,.45)';
    for(const i of vis)ctx.stroke(L[i]);
    if(G){ctx.lineWidth=2/K;ctx.strokeStyle='#fff';for(const i of vis)if(G.owner[i]===G.player)ctx.stroke(L[i]);
      ctx.setLineDash([4/K,3/K]);ctx.strokeStyle='#ff3b3b';for(const i of vis)if(G.war.includes(G.owner[i]))ctx.stroke(L[i]);ctx.setLineDash([])}
    if(sel>=0){ctx.lineWidth=2.5/K;ctx.strokeStyle='#ffd84a';ctx.stroke(L[sel])}
    if(G)drawOffensives(ox);
    drawLabels(ox,vx0,vx1);
  }
}
function scr(p,ox){return[p[0]*K+ox,p[1]*K+Y]}
function drawOffensives(ox){ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const o of G.offs){const a=scr(LP[o.from],ox),b=scr(LP[o.t],ox);
    if(Math.abs(LP[o.from][0]-LP[o.t][0])>MW/2)continue;
    const mine=o.a===G.player||G.owner[o.t]===G.player;
    ctx.strokeStyle=o.a===G.player?'#ffe14a':mine?'#ff4040':'rgba(255,90,90,.55)';ctx.lineWidth=mine?3:1.6;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-Math.hypot(b[0]-a[0],b[1]-a[1])*.2;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(mx,my,b[0],b[1]);ctx.stroke();
    const ang=Math.atan2(b[1]-my,b[0]-mx);ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();
    ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-10*Math.cos(ang-.4),b[1]-10*Math.sin(ang-.4));ctx.lineTo(b[0]-10*Math.cos(ang+.4),b[1]-10*Math.sin(ang+.4));ctx.fill();
    if(mine){ctx.fillStyle='#000a';ctx.fillRect(b[0]-16,b[1]+6,32,5);ctx.fillStyle='#ffe14a';ctx.fillRect(b[0]-16,b[1]+6,32*Math.max(0,o.p)/100,5)}}}
let NL=[]; // nation labels [owner, territory]
function calcLabels(){if(!G){NL=F.map((f,i)=>[i,i]);return}const best={};
  for(let i=0;i<F.length;i++){const o=G.owner[i];if(best[o]===undefined||AREA[i]>AREA[best[o]])best[o]=i}
  NL=Object.entries(best).map(([o,i])=>[+o,i])}
function drawLabels(ox,vx0,vx1){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  for(const[o,i]of NL){const w=LW[i]*K;if(w<45)continue;const p=LP[i];if(p[0]<vx0||p[0]>vx1)continue;
    const[x,y]=scr(p,ox);if(y<0||y>H)continue;const t=F[o].properties.n,fs=Math.min(22,Math.max(9,w/(t.length*.75)));if(fs<9.5&&w<90)continue;
    ctx.font=`700 ${fs|0}px system-ui`;
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(t,x,y);ctx.fillStyle='#fff';ctx.fillText(t,x,y)}}
addEventListener('resize',resize);

// ================= GAME (real time) =================
let G=null;const SAVE='geopolit_rts_v2';
const MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const SPEEDS=[0,1,3,8,20];  // days per second
let speed=1;
const fmt=n=>{n=Math.round(n);const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(2)+'трлн':a>=1e3?(n/1e3).toFixed(1)+'млрд':n+'млн'};
const fmtN=n=>n>=1e6?(n/1e6).toFixed(2)+' млн':n>=1e3?(n/1e3).toFixed(0)+' тыс':Math.round(n)+'';
const flagImg=(i,cls='flag')=>{const f=F[i].properties.f;return f?`<img class="${cls}" src="flags/${f}.svg">`:`<span class="${cls}" style="display:inline-block"></span>`};
const nm=i=>F[i].properties.n;
function newGame(p){const n=F.length;
  G={player:p,day:0,owner:[...Array(n).keys()],nat:[],allies:[],war:[],rel:{},log:[],offs:[],col:{},aiWar:[]};
  for(let i=0;i<n;i++){const pr=F[i].properties,gdp=Math.max(pr.gdp,50);
    G.nat.push({gdp,money:gdp*.05,army:Math.max(500,Math.sqrt(pr.pop)*25+gdp*.004),stab:60+Math.random()*30,tech:1})}
  addLog(`🎖️ Вы возглавили страну ${nm(p)}.`);startGame();zoomTo(p)}
let TER={},INC={};
function recalc(){TER={};INC={};for(let i=0;i<F.length;i++){const o=G.owner[i];(TER[o]||(TER[o]=[])).push(i);INC[o]=(INC[o]||0)+G.nat[i].gdp}calcLabels()}
const terr=o=>TER[o]||[],income=o=>INC[o]||0,power=o=>G.nat[o].army*G.nat[o].tech,nations=()=>Object.keys(TER).map(Number);
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}
function dateStr(){const d=new Date(Date.UTC(2026,0,1)+G.day*864e5);return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear()}
function addLog(t){G.log.unshift(`<b>${dateStr()}</b> ${t}`);G.log=G.log.slice(0,50);logDirty=true}
let logDirty=true;
function startGame(){recalc();document.getElementById('hud').style.display='flex';document.getElementById('log').style.display='block';
  spd.innerHTML=['⏸','▶','▶▶','▶▶▶','⏩'].map((s,i)=>`<button id="sp${i}" onclick="setSpeed(${i})">${s}</button>`).join('');setSpeed(1);updHud();draw()}
function setSpeed(i){speed=i;for(let j=0;j<5;j++)document.getElementById('sp'+j).classList.toggle('on',j===i)}
function updHud(){const p=G.player,n=G.nat[p];
  me.innerHTML=flagImg(p)+'<b>'+nm(p)+'</b>';money.textContent='$'+fmt(n.money);inc.textContent=' +'+fmt(dailyInc(p)*30)+'/мес';
  army.textContent=fmtN(n.army);stab.textContent=Math.round(n.stab)+'%';date.textContent=dateStr();
  if(logDirty){log.innerHTML=G.log.slice(0,20).map(x=>`<div>${x}</div>`).join('');logDirty=false}}
function dailyInc(o){const N=G.nat[o];return income(o)*.0009*(N.stab/100+.3)-N.army*.000015}
function adjMode(o,t){for(const i of terr(o))if(NB[i].includes(t))return{m:'land',from:i};
  let bd=1e9,bf=-1;for(const i of terr(o)){const d=d3.geoDistance(CEN[i],CEN[t])*6371;if(d<bd){bd=d;bf=i}}
  return bd<1800?{m:'sea',from:bf}:null}
function winChance(a,t,mode){const o=G.owner[t];let atk=power(a)*(mode==='sea'?.6:1)*(G.nat[a].stab/100+.5);
  const share=1/Math.max(1,terr(o).length*.6);let def=power(o)*Math.max(.35,share)*1.25*(G.nat[o].stab/100+.5);
  if(o===G.player)for(const al of G.allies)def+=power(al)*.15;else if(G.allies.includes(o))def+=power(G.player)*.15;
  return atk/(atk+def)}
function startOff(a,t){if(G.offs.some(x=>x.a===a&&x.t===t))return false;const ad=adjMode(a,t);if(!ad)return false;
  G.offs.push({a,t,from:ad.from,m:ad.m,p:0});return true}
function atWar(a,b){if(a===G.player)return G.war.includes(b);if(b===G.player)return G.war.includes(a);
  return G.aiWar.some(w=>(w[0]===a&&w[1]===b)||(w[0]===b&&w[1]===a))}
function stepOffs(){
  for(const o of G.offs){const def=G.owner[o.t];
    if(def===o.a||!atWar(o.a,def)||G.owner[o.from]!==o.a){o.done=1;continue}
    const ch=winChance(o.a,o.t,o.m);o.p+=(ch-.38)*14+(Math.random()-.5)*4;
    const A=G.nat[o.a],D=G.nat[def];A.army=Math.max(100,A.army*(1-.0025*(1.2-ch)));D.army=Math.max(100,D.army*(1-.002*(.4+ch)));
    if(o.p>=100){o.done=1;conquer(o.a,o.t)}
    else if(o.p<-40){o.done=1;if(o.a===G.player||def===G.player)addLog(`🛡️ ${nm(def)} отбила наступление на ${nm(o.t)}.`)}}
  G.offs=G.offs.filter(o=>!o.done)}
function conquer(a,t){const o=G.owner[t];G.owner[t]=a;G.nat[a].money+=G.nat[o].money*.1;G.nat[t].gdp*=.9;recalc();
  if(a===G.player||o===G.player)addLog(`${a===G.player?'🏆':'💥'} ${nm(a)} захватывает ${nm(t)}!`);
  else if(F[t].properties.pop>8e6)addLog(`📰 ${nm(a)} захватила ${nm(t)}.`);
  if(!terr(o).length){if(F[o].properties.pop>2e6||G.war.includes(o))addLog(`☠️ ${nm(o)} прекратила существование.`);
    G.war=G.war.filter(w=>w!==o);G.allies=G.allies.filter(w=>w!==o);G.aiWar=G.aiWar.filter(w=>w[0]!==o&&w[1]!==o);
    if(o===G.player)gameOver(false)}
  if(sel>=0&&!modalOpen())showPanel(sel)}
function dayTick(){G.day++;const me=G.player;
  for(const o of nations()){const N=G.nat[o];N.money+=dailyInc(o);N.stab+=(65-N.stab)*.004;
    if(N.money<0){N.stab-=.15;N.army*=.998}
    if(o!==me)N.army*=1.0004}
  if(G.day%30===0){for(let i=0;i<F.length;i++)G.nat[i].gdp*=1.0025;recalc()}
  stepOffs();
  // AI: few nations decide each day
  const ns=nations();for(let k=0;k<6;k++)aiThink(ns[Math.floor(Math.random()*ns.length)]);
  if(Math.random()<.004)randomEvent();
  if(G.day%15===0)save();
  if(ns.length===1)gameOver(true)}
function aiThink(o){if(o===G.player)return;const N=G.nat[o],inc=income(o);
  if(N.money>inc*.06){N.army*=1.06;N.money-=inc*.04}
  const enemies=[];if(G.war.includes(o))enemies.push(G.player);for(const w of G.aiWar){if(w[0]===o)enemies.push(w[1]);if(w[1]===o)enemies.push(w[0])}
  // attack targets bordering enemies
  for(const e of enemies){if(G.offs.filter(x=>x.a===o).length>=2)break;
    for(const i of terr(o)){const t=NB[i].find(n=>G.owner[n]===e);if(t!==undefined){if(winChance(o,t,'land')>.4)startOff(o,t);break}}}
  // make peace
  if(enemies.length&&Math.random()<.05){const e=enemies[0];if(e!==G.player){G.aiWar=G.aiWar.filter(w=>!(w.includes(o)&&w.includes(e)))}}
  // declare new war
  if(Math.random()<.04&&enemies.length===0){const c=[];for(const i of terr(o))for(const n of NB[i]){const t=G.owner[n];if(t!==o)c.push(t)}
    if(!c.length)return;const t=c[Math.floor(Math.random()*c.length)];
    if(power(o)>power(t)*1.6){if(t===G.player){if(G.allies.includes(o))return;G.war.push(o);addLog(`🚨 ${nm(o)} объявляет вам войну!`);setSpeed(0)}
      else{if(G.allies.includes(t)&&Math.random()<.5)return;G.aiWar.push([o,t]);if(F[o].properties.pop>2e7||F[t].properties.pop>2e7)addLog(`⚔️ ${nm(o)} объявила войну ${nm(t)}.`)}}}}
function randomEvent(){const me=G.player,M=G.nat[me],ev=[
  ()=>{M.money+=income(me)*.02;return'🛢️ Найдено месторождение нефти! Бюджет пополнен.'},
  ()=>{M.stab-=7;return'✊ Массовые протесты в столице.'},
  ()=>{for(const i of terr(me))G.nat[i].gdp*=.97;recalc();return'📉 Мировой кризис ударил по экономике.'},
  ()=>{M.tech+=.1;return'💡 Учёные совершили открытие.'},
  ()=>{M.army*=.96;return'🌪️ Стихийное бедствие.'}];addLog(ev[Math.floor(Math.random()*ev.length)]())}

let last=performance.now(),acc=0,hudT=0;
function loop(now){const dt=Math.min(.25,(now-last)/1000);last=now;
  if(G&&!modalOpen()&&speed>0){acc+=dt*SPEEDS[speed];let n=0;let ch=false;
    while(acc>=1&&n<10){acc-=1;n++;const before=G.offs.length+'/'+G.day;dayTick();ch=true}
    if(ch){draw();hudT+=n}
    if(hudT>0){updHud();hudT=0;if(sel>=0&&panel.style.display==='block')refreshPanelLight()}}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ================= UI =================
function modalOpen(){return !!document.getElementById('modal')}
function onTap(i){if(i<0){closePanel();return}sel=i;draw();if(!G){confirmPick(i);return}showPanel(i)}
function closePanel(){sel=-1;panel.style.display='none';draw()}
let panelSig='';
function refreshPanelLight(){const s=panelState(sel);if(s!==panelSig)showPanel(sel);else{const e=document.getElementById('offs');if(e)e.innerHTML=offsHtml(sel)}}
function panelState(i){const o=G.owner[i],M=G.nat[G.player];return [o,G.war.includes(o),G.allies.includes(o),M.money>recCost(),M.money>invCost(i),M.money>techCost(),M.money>stabCost(),M.money>spyCost(),!!adjMode(G.player,i)].join()}
function offsHtml(i){const o=G.owner[i];const list=G.offs.filter(x=>(x.a===G.player&&G.owner[x.t]===o)||(x.a===o&&G.owner[x.t]===G.player)||(o===G.player&&(x.a===o||G.owner[x.t]===o)));
  return list.map(x=>`<div class="off">${x.a===G.player?'➡️':'⬅️'} ${nm(x.a)} → ${nm(x.t)} ${x.m==='sea'?'(десант)':''}<div class="prog"><i style="width:${Math.max(0,x.p)}%"></i></div></div>`).join('')}
function showPanel(i){panelSig=panelState(i);const pr=F[i].properties,o=G.owner[i],N=G.nat[o],me=G.player,M=G.nat[me];
  let h=`<button class="x" onclick="closePanel()">✕</button><div style="display:flex;gap:10px;align-items:center">${flagImg(i,'flag big')}<div><h2>${pr.n}</h2><span class="tag">${pr.c||''}</span></div></div>`;
  if(o!==i)h+=`<div style="margin-top:8px" class="chip">${flagImg(o)} Под контролем: <b>${nm(o)}</b></div>`;
  h+=`<div style="margin-top:8px">
  <div class="row"><span>Население</span><span>${fmtN(pr.pop)}</span></div>
  <div class="row"><span>ВВП территории</span><span>$${fmt(G.nat[i].gdp)}</span></div>
  <div class="row"><span>Армия державы</span><span>${fmtN(N.army)}</span></div>
  <div class="row"><span>Технологии</span><span>ур. ${N.tech.toFixed(1)}</span></div>
  <div class="row"><span>Стабильность</span><span>${Math.round(N.stab)}%</span></div>
  <div class="row"><span>Территорий</span><span>${terr(o).length}</span></div>
  <div class="row"><span>Отношения</span><span>${o===me?'—':rel(o)}</span></div></div><div class="acts">`;
  if(o===me){
    h+=`<button class="p" onclick="act('rec')" ${M.money<recCost()?'disabled':''}>🪖 Мобилизация<br><small>$${fmt(recCost())}</small></button>
    <button onclick="act('inv',${i})" ${M.money<invCost(i)?'disabled':''}>🏭 Инвестиции<br><small>$${fmt(invCost(i))}</small></button>
    <button onclick="act('tech')" ${M.money<techCost()?'disabled':''}>🔬 Наука<br><small>$${fmt(techCost())}</small></button>
    <button onclick="act('stab')" ${M.money<stabCost()?'disabled':''}>🎉 Соцпрограммы<br><small>$${fmt(stabCost())}</small></button>`;
  }else{
    const ad=adjMode(me,i),war=G.war.includes(o),ally=G.allies.includes(o),going=G.offs.some(x=>x.a===me&&x.t===i);
    if(war)h+=`<button class="r" onclick="act('atk',${i})" ${ad&&!going?'':'disabled'}>⚔️ Наступление<br><small>${going?'идёт':ad?Math.round(winChance(me,i,ad.m)*100)+'% · '+(ad.m==='land'?'суша':'десант'):'нет границы'}</small></button>
      <button onclick="act('peace',${o})">🕊️ Мир</button>`;
    else h+=`<button class="r" onclick="act('war',${o})" ${ally?'disabled':''}>⚔️ Объявить войну</button>
      <button class="g" onclick="act('ally',${o})" ${ally?'disabled':''}>🤝 Союз</button>`;
    h+=`<button onclick="act('trade',${o})" ${war?'disabled':''}>📦 Торговля</button>
    <button onclick="act('sanc',${o})">🚫 Санкции</button>
    <button onclick="act('spy',${o})" ${M.money<spyCost()?'disabled':''}>🕵️ Переворот<br><small>$${fmt(spyCost())}</small></button>`;
  }
  h+=`</div><div id="offs">${offsHtml(i)}</div><button style="width:100%;margin-top:6px" onclick="zoomTo(${i})">🔍 Приблизить</button>`;
  panel.innerHTML=h;panel.style.display='block'}
function rel(o){const r=G.rel[o]??0;return G.allies.includes(o)?'🤝 Союзник':G.war.includes(o)?'⚔️ Война':r>30?'😊 Дружба':r<-30?'😠 Враждебность':'😐 Нейтралитет'}
const recCost=()=>income(G.player)*.03+20,invCost=i=>G.nat[i].gdp*.08+15,
  techCost=()=>income(G.player)*.06*G.nat[G.player].tech+30,stabCost=()=>income(G.player)*.02+10,spyCost=()=>income(G.player)*.05+40;
function act(a,x){const me=G.player,M=G.nat[me];
  switch(a){
  case'rec':{M.money-=recCost();const add=Math.max(2000,M.army*.12);M.army+=add;M.stab-=1.5;addLog(`🪖 Мобилизовано ${fmtN(add)} солдат.`);break}
  case'inv':{M.money-=invCost(x);G.nat[x].gdp*=1.06;recalc();addLog(`🏭 Инвестиции в ${nm(x)}: ВВП +6%.`);break}
  case'tech':{M.money-=techCost();M.tech+=.2;addLog(`🔬 Технологии ур. ${M.tech.toFixed(1)}.`);break}
  case'stab':{M.money-=stabCost();M.stab=Math.min(100,M.stab+8);addLog('🎉 Стабильность выросла.');break}
  case'war':{G.war.push(x);G.rel[x]=-100;M.stab-=4;addLog(`⚔️ Вы объявили войну: ${nm(x)}!`);break}
  case'peace':{if(G.nat[x].army<M.army*.5||Math.random()<.4){G.war=G.war.filter(w=>w!==x);G.rel[x]=-20;addLog(`🕊️ Мир с ${nm(x)}.`)}else addLog(`❌ ${nm(x)} отвергает мир.`);break}
  case'ally':{const r=(G.rel[x]??0)+Math.random()*60-10+(power(me)>power(x)?20:0);if(r>45){G.allies.push(x);G.rel[x]=80;addLog(`🤝 ${nm(x)} — ваш союзник!`)}else{G.rel[x]=(G.rel[x]??0)+5;addLog(`❌ ${nm(x)} отклоняет союз.`)}break}
  case'trade':{const g=Math.min(income(x),income(me))*.03;M.money+=g;G.nat[x].money+=g*.5;G.rel[x]=(G.rel[x]??0)+10;addLog(`📦 Сделка с ${nm(x)}: +$${fmt(g)}.`);break}
  case'sanc':{G.nat[x].money*=.85;G.nat[x].stab-=5;G.rel[x]=(G.rel[x]??0)-30;G.allies=G.allies.filter(y=>y!==x);M.money-=income(me)*.01;addLog(`🚫 Санкции против ${nm(x)}.`);break}
  case'spy':{M.money-=spyCost();const N=G.nat[x];if(Math.random()<(100-N.stab)/130){N.stab-=25;N.army*=.7;addLog(`🕵️ Переворот в ${nm(x)} удался!`)}else{G.rel[x]=-80;addLog(`🚨 Агенты раскрыты в ${nm(x)}!`)}break}
  case'atk':{if(startOff(me,x))addLog(`➡️ Наступление на ${nm(x)} началось.`);break}
  }
  updHud();save();draw();if(sel>=0)showPanel(sel)}
function gameOver(win){localStorage.removeItem(SAVE);modal(`<h1>${win?'🌍 Мировое господство!':'☠️ Поражение'}</h1><p>${win?'Весь мир под вашим флагом.':'Ваше государство пало.'}</p><button class="p" onclick="restart()">Новая игра</button>`)}
function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(m);return m}
function closeModal(){document.getElementById('modal')?.remove()}
function restart(){localStorage.removeItem(SAVE);G=null;closeModal();closePanel();hud.style.display='none';log.style.display='none';calcLabels();pickScreen();draw()}
function menu(){modal(`<h1>Меню</h1><p>${dateStr()}</p><div style="display:grid;gap:8px"><button class="p" onclick="closeModal()">Продолжить</button><button onclick="closeModal();zoomTo(G.player)">К моей стране</button><button onclick="save();closeModal()">💾 Сохранить</button><button class="r" onclick="restart()">Новая игра</button></div>`)}
function showRank(){const r=nations().map(o=>({o,s:income(o)+power(o)*.05,t:terr(o).length})).sort((a,b)=>b.s-a.s).slice(0,40);
  modal(`<h1>🏆 Рейтинг держав</h1><div class="list">${r.map((x,k)=>`<div class="it" onclick="closeModal();zoomTo(${x.o});onTap(${x.o})"><b>${k+1}</b><span class="sw" style="background:${natColor(x.o)}"></span>${flagImg(x.o)}<span style="flex:1">${nm(x.o)}${x.o===G.player?' (вы)':''}</span><span class="tag">${x.t} терр.</span><span class="tag">$${fmt(income(x.o))}</span></div>`).join('')}</div><br><button onclick="closeModal()">Закрыть</button>`)}
function pickScreen(){calcLabels();
  modal(`<h1>🌍 Мировая Держава</h1><p style="color:var(--mut)">Выберите страну — коснитесь её на карте или найдите в списке</p><input id="search" placeholder="Поиск страны…"><div class="list" id="plist"></div><br><button onclick="closeModal()">Выбрать на карте</button>`);
  const order=F.map((f,i)=>i).filter(i=>F[i].properties.pop>0).sort((a,b)=>F[b].properties.gdp-F[a].properties.gdp);
  const fill=q=>{plist.innerHTML=order.filter(i=>!q||nm(i).toLowerCase().includes(q)||F[i].properties.e.toLowerCase().includes(q)).map(i=>`<div class="it" onclick="confirmPick(${i})"><span class="sw" style="background:${natColor(i)}"></span>${flagImg(i)}<span style="flex:1">${nm(i)}</span><span class="tag">$${fmt(F[i].properties.gdp)}</span></div>`).join('')};
  fill('');search.oninput=e=>fill(e.target.value.toLowerCase().trim())}
function confirmPick(i){if(F[i].properties.pop<=0)return;const p=F[i].properties;
  modal(`${flagImg(i,'flag big')}<h1>${p.n}</h1><p>Население: ${fmtN(p.pop)}<br>ВВП: $${fmt(p.gdp)}</p><div style="display:flex;gap:8px;justify-content:center"><button onclick="pickScreen()">Назад</button><button class="p" onclick="closeModal();newGame(${i})">Играть</button></div>`);
  zoomTo(i)}
window.onBack=()=>{if(modalOpen()){if(G)closeModal();return true}if(panel.style.display==='block'){closePanel();return true}if(G){menu();return true}return false};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save()});
init();
</script></body></html>
