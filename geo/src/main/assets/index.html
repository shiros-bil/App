<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мировая Держава</title>
<style>
:root{--bg:#0a0f1a;--panel:rgba(12,18,32,.86);--panel2:rgba(20,30,52,.9);--line:rgba(140,170,220,.16);--txt:#eef3ff;--mut:#93a3c4;--acc:#4c8dff;--good:#3fd07a;--bad:#ff5a5a;--gold:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0a2a4a;color:var(--txt);font:14px Inter,system-ui,Roboto,sans-serif;overflow:hidden;letter-spacing:.1px}
canvas{position:absolute;inset:0;touch-action:none}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px}
.hud{position:absolute;left:0;right:auto;top:0;flex-wrap:nowrap!important;display:flex;gap:6px;padding:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.chip{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chip .ic{color:var(--gold)}.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip.me{font-weight:700}
.good{color:var(--good)}
.flag{width:28px;height:20px;border-radius:4px;object-fit:cover;background:#fff;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.flag.big{width:66px;height:46px;border-radius:6px}
.sp{flex:1}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;transition:background .15s}
button:active{transform:scale(.96)}
button.ib{padding:8px 10px}
button.p{background:var(--acc);border-color:transparent}
button.r{background:linear-gradient(180deg,#a3262b,#7d1c21);border-color:transparent}
button.g{background:linear-gradient(180deg,#1f7a46,#165c35);border-color:transparent}
button.on{background:var(--acc);border-color:transparent}
button:disabled{opacity:.38}
button small{width:100%;font-weight:500;opacity:.75;font-size:11px}
.tbox{position:fixed;top:8px;right:8px;z-index:5;display:flex;align-items:center;gap:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.clock{display:flex;align-items:center;gap:6px;white-space:nowrap;padding-right:6px;border-right:1px solid var(--line)}.clock .ic{color:var(--gold)}.clock b{font-variant-numeric:tabular-nums}
#clk{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600;min-width:42px}
.spd{display:flex;gap:2px}
.spd button{padding:6px 8px;border:0;background:transparent;border-radius:9px}.spd button.on{background:var(--acc)}
#panel{position:absolute;right:8px;bottom:8px;top:58px;width:min(340px,46vw);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#panel h2{margin:0;font-size:18px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);color:var(--mut)}
.row span:last-child{color:var(--txt);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.x{position:absolute;right:8px;top:8px;background:none;border:0;padding:6px}
#log{display:none!important;position:absolute;left:8px;bottom:8px;width:min(330px,44vw);max-height:26vh;overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:12px}
#log div{padding:4px 0;border-bottom:1px solid var(--line)}
#log .ic{width:14px;height:14px;vertical-align:-2px;color:var(--gold)}
.modal{position:absolute;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:92vw;max-height:90vh;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h1{margin:0 0 8px;font-size:22px;display:flex;gap:8px;align-items:center;justify-content:center}
.list{text-align:left;max-height:55vh;overflow:auto}
.list .it{display:flex;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.list .it:active{background:rgba(255,255,255,.05)}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
#search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt);font:inherit;margin-bottom:8px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;background:radial-gradient(circle at 50% 40%,#13254a,#060a14)}
.bar{width:220px;height:6px;background:#1a2540;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--acc);animation:l 1s infinite alternate}
@keyframes l{to{margin-left:70%}}
.tag{font-size:11px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--mut);display:inline-flex;gap:4px;align-items:center}
.tag .ic{width:12px;height:12px}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--bad)}
.off{padding:8px;border:1px solid rgba(255,90,90,.25);border-radius:10px;margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.off .prog{width:100%}
#seap{position:absolute;right:8px;bottom:8px;width:min(230px,40vw);height:52px;display:none;align-items:center;gap:14px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#seap img{height:100%;width:62px;object-fit:cover}#seap h2{margin:0 0 2px;font-size:13px;line-height:1.1}#seap .tag{font-size:10px;padding:1px 6px}#seap .x{position:absolute;right:2px;top:2px;padding:3px}#seap .x .ic{width:14px;height:14px}#seap{gap:8px}
#pc{position:fixed;inset:0;z-index:30;background:#0b1220;display:grid;grid-template-columns:minmax(0,1fr) min(320px,42vw);grid-template-rows:auto minmax(0,1fr)}
.pcbar{grid-column:1/3;display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.pcbar span{display:flex;gap:6px;align-items:center}
.pcmap{position:relative;min-width:0;min-height:0;overflow:hidden}#pccv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pcside{overflow:auto;padding:10px;border-left:1px solid var(--line);background:var(--panel);font-size:13px}
.pcside input,.pcside select{width:100%;box-sizing:border-box;margin:6px 0;padding:7px;border-radius:9px;border:1px solid var(--line);background:#0006;color:inherit}
.pcside input[type=range]{width:60%;margin:0}.pct button.on{background:var(--acc)}.pcsec{margin-top:12px;font-weight:600;opacity:.85}button.mini{padding:1px 6px;font-size:11px;margin-left:4px}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:6;display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;pointer-events:none;white-space:nowrap}#seap .st{padding-right:22px;min-width:0}
@media (max-width:1100px){.hud{gap:4px!important;padding:6px!important}.hud .chip{padding:4px 7px;gap:5px;font-size:12.5px}.hud .chip .flag{width:22px;height:16px}#inc{font-size:11px}
.tbox{padding:2px 2px 2px 8px}.clock{gap:4px;font-size:12.5px}.spd button{padding:5px 6px}.tbox .ic,.hud .ic{width:16px;height:16px}.hud img[src="army.png"]{height:18px!important}}
</style></head><body>
<canvas id="g"></canvas><canvas id="c"></canvas>
<div class="hud" id="hud" style="display:none">
  <div class="chip me" id="me"></div>
  <div class="chip"><i data-i="coins"></i><b id="money"></b><small id="inc" class="good"></small></div>
  <div class="chip"><i data-i="users"></i><b id="popu"></b></div>
  <div class="chip"><img src="army.png" style="height:22px"><b id="army"></b></div>
  <div class="sp"></div>
  <div class="tbox"><div class="clock"><i data-i="calendar"></i><b id="date"></b><span id="clk"></span></div><div class="spd" id="spd"></div></div>
</div>
<div id="panel"></div>
<div id="log" style="display:none"></div>
<div id="load"><b>Загрузка карты мира…</b><div class="bar"><i></i></div></div>

<script src="topojson-client.min.js"></script>

function closeModal(){document.getElementById('modal')?.remove()}
function restart(){localStorage.removeItem(SAVE);G=null;ownVer++;closeModal();closePanel();hud.style.display='none';log.style.display='none';invalidate();pickScreen()}
function menu(){modal(`<h1>Меню</h1><p>${dateStr()}</p><div style="display:grid;gap:8px"><button class="p" onclick="closeModal()">Продолжить</button><button onclick="closeModal();zoomToNat(G.player)">К моей стране</button><button onclick="save();closeModal()">${I("save")} Сохранить</button><button class="r" onclick="restart()">Новая игра</button></div>`)}
function showRank(){const r=nations().map(o=>({o,s:income(o)+power(o)*.05,t:terr(o).length})).sort((a,b)=>b.s-a.s).slice(0,40);
  modal(`<h1>${I("trophy")} Рейтинг держав</h1><div class="list">${r.map((x,k)=>`<div class="it" onclick="closeModal();zoomToNat(${x.o})"><b>${k+1}</b><span class="sw" style="background:${natColor(x.o)}"></span>${flagImg(x.o)}<span style="flex:1">${nm(x.o)}${x.o===G.player?' (вы)':''}</span><span class="tag">${x.t} рег.</span><span class="tag">$${fmt(income(x.o))}</span></div>`).join('')}</div><br><button onclick="closeModal()">Закрыть</button>`)}
function pickScreen(){
  modal(`<h1>${I("globe")} Мировая Держава</h1><p style="color:var(--mut)">Выберите страну — коснитесь её на карте или найдите в списке</p><input id="search" placeholder="Поиск страны…"><div class="list" id="plist"></div><br><button onclick="closeModal()">Выбрать на карте</button>`);
  const order=NAT.map((f,i)=>i).filter(i=>NAT[i].pop>0&&RK.includes(i)).sort((a,b)=>NAT[b].gdp-NAT[a].gdp);
  const fill=q=>{plist.innerHTML=order.filter(i=>!q||nm(i).toLowerCase().includes(q)||NAT[i].e.toLowerCase().includes(q)).map(i=>`<div class="it" onclick="confirmPick(${i})"><span class="sw" style="background:${natColor(i)}"></span>${flagImg(i)}<span style="flex:1">${nm(i)}</span><span class="tag">$${fmt(NAT[i].gdp)}</span></div>`).join('')};
  fill('');search.oninput=e=>fill(e.target.value.toLowerCase().trim())}
function confirmPick(i){if(NAT[i].pop<=0)return;const p=NAT[i];
  modal(`${flagImg(i,'flag big')}<h1>${p.n}</h1><p>Население: ${fmtN(p.pop)}<br>ВВП: $${fmt(p.gdp)}</p><div style="display:flex;gap:8px;justify-content:center"><button onclick="pickScreen()">Назад</button><button class="p" onclick="closeModal();newGame(${i})">Играть</button></div>`);
  zoomToNat(i)}
window.onBack=()=>{if(modalOpen()){if(G)closeModal();return true}if(panel.style.display==='block'){closePanel();return true}if(G){menu();return true}return false};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save()});
init();
</script></body></html>
