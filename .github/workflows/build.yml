name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Rust core (Android)
        run: |
          set -e
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd geo/native
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../src/main/jniLibs build --release --lib 2>&1 | tee ../../rust.log
      - name: Build
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
            unzip -q gradle-8.14.3-bin.zip
            ./gradle-8.14.3/bin/gradle :app:assembleRelease :geo:assembleRelease --no-daemon
          } 2>&1 | tee build.log
      - run: cp app/build/outputs/apk/release/app-release.apk BlueWave.apk && cp geo/build/outputs/apk/release/geo-release.apk GeoPolit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlueWave build ${{ github.run_number }}
          files: |
            BlueWave.apk
            GeoPolit.apk
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          files: |
            build.log
            rust.log
