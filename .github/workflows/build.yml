name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
            unzip -q gradle-8.14.3-bin.zip
            ./gradle-8.14.3/bin/gradle :app:assembleRelease --no-daemon
          } 2>&1 | tee build.log
      - run: cp app/build/outputs/apk/release/app-release.apk BlueWave.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlueWave build ${{ github.run_number }}
          files: BlueWave.apk
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          files: build.log
