name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: set -o pipefail; gradle :app:assembleRelease 2>&1 | tee build.log
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          files: build.log
      - run: cp app/build/outputs/apk/release/app-release.apk BlueWave.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlueWave build ${{ github.run_number }}
          files: BlueWave.apk
