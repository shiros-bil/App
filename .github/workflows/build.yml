name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Rust core (Android)
        run: |
          set -e
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd geo/native
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../src/main/jniLibs build --release --lib 2>&1 | tee ../../rust.log
      - name: Build
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
            unzip -q gradle-8.14.3-bin.zip
            ./gradle-8.14.3/bin/gradle :app:assembleRelease :geo:assembleRelease --no-daemon
          } 2>&1 | tee build.log
      - run: cp app/build/outputs/apk/release/app-release.apk BlueWave.apk && cp geo/build/outputs/apk/release/geo-release.apk GeoPolit.apk
      - uses: actions/upload-artifact@v4
        with: { name: geo-apk, path: GeoPolit.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlueWave build ${{ github.run_number }}
          files: |
            BlueWave.apk
            GeoPolit.apk
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          files: |
            build.log
            rust.log
  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: geo-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash geo/tools/emu_test.sh
      - if: always()
        run: cd shots && zip -q ../emu-shots.zip * || true
      - if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emu-${{ github.run_number }}
          name: emulator test ${{ github.run_number }}
          prerelease: true
          files: emu-shots.zip
